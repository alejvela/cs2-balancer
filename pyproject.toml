[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cs2-balancer"
version = "0.5.0"
description = "CS2 LAN team balancer with FAST, STABLE and GLOBAL optimization modes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "LAN Team Balancer contributors" }
]
dependencies = [
    "requests>=2.31,<3.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "application*",
    "configuration*",
    "core*",
    "evaluation*",
    "exporters*",
    "generators*",
    "importers*",
    "models*",
    "objective*",
    "optimizer*",
    "scoring*",
    "scrapers*",
]
exclude = [
    "tests*",
    "data*",
    "output*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = [
    "application",
    "evaluation",
    "generators",
    "importers",
    "models",
    "objective",
    "optimizer",
    "scoring",
    "scrapers",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    "output",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
]

ignore = [
    "E501",
    "UP042",
]
[tool.ruff.lint.isort]
known-first-party = [
    "application",
    "configuration",
    "core",
    "evaluation",
    "exporters",
    "generators",
    "importers",
    "models",
    "objective",
    "optimizer",
    "scoring",
    "scrapers",
]
